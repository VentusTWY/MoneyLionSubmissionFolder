name: loan-risk-predictor

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: loan-risk-api
    ports:
      - "8000:8000"
    environment:
      MODEL_REGISTRY_URI: file:///app/registry
      UI_ORIGINS: http://localhost:3000
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in your local .env file}
    volumes:
      - ./registry:/app/registry
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')
      interval: 10s
      timeout: 3s
      retries: 10

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    image: loan-risk-ui
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in your local .env file}
      ADMIN_DEMO_EMAIL: ${ADMIN_DEMO_EMAIL:?Set ADMIN_DEMO_EMAIL in your local .env file}
      ADMIN_DEMO_PASSWORD: ${ADMIN_DEMO_PASSWORD:?Set ADMIN_DEMO_PASSWORD in your local .env file}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set ADMIN_SESSION_SECRET in your local .env file}
