name: loan-risk-predictor

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: loan-risk-api
    ports:
      - "8000:8000"
    environment:
      MODEL_REGISTRY_URI: file:///app/registry
      UI_ORIGINS: http://localhost:3000
      # Empty enables the local POC's admin mode. Set a secret outside local development.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    volumes:
      - ./registry:/app/registry
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')
      interval: 10s
      timeout: 3s
      retries: 10

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    image: loan-risk-ui
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
