data:
  # Place the source Parquet files in data/raw/ before running the pipeline.
  loans: "data/raw/loan.parquet"
  payments: "data/raw/payment.parquet"
  clarity: "data/raw/clarity_underwriting_variables.parquet"

# Primary POC prediction point: the risk score is produced before pricing so it
# can inform later approval, APR, and repayment-term decisions. Pricing-derived
# fields are therefore explicitly unavailable to this model.
feature_contract:
  name: pre_pricing_v1
  prediction_point: before_pricing
  exclude:
    - apr
    - originallyScheduledPaymentAmount

label:
  target_name: adverse_outcome
  positive_statuses:
    - External Collection
    - Internal Collection
    - Settled Bankruptcy
    - Charged Off
  negative_statuses:
    - Paid Off Loan
  # DISCLAIMER: The supplied data dictionary does not define "Settlement Paid
  # Off" or "Charged Off Paid Off". Both statuses are excluded from the primary
  # baseline rather than assigned an unsupported good/bad label. They may be
  # evaluated in separately configured sensitivity analyses.

split:
  validation_fraction: 0.15
  test_fraction: 0.20

model:
  objective: binary
  n_estimators: 1000
  learning_rate: 0.03
  num_leaves: 31
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0
  random_state: 42
  n_jobs: -1
  verbosity: -1

training:
  early_stopping_rounds: 50

evaluation:
  threshold: 0.50
  reject_threshold: 0.75

output_dir: artifacts/prepricing_lightgbm
